name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test || true

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: |
          npm pack
          mv promptbrain-cli-${{ steps.get_version.outputs.VERSION }}.tgz promptbrain-cli-v${{ steps.get_version.outputs.VERSION }}.tgz

      - name: Generate SHA256
        id: sha256
        run: |
          SHA256=$(sha256sum promptbrain-cli-v${{ steps.get_version.outputs.VERSION }}.tgz | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            promptbrain-cli-v${{ steps.get_version.outputs.VERSION }}.tgz
          body: |
            ## PBCLI v${{ steps.get_version.outputs.VERSION }}

            ### Installation

            **npm:**
            ```bash
            npm install -g promptbrain-cli@${{ steps.get_version.outputs.VERSION }}
            ```

            **Homebrew:**
            ```bash
            brew tap promptbrain/tap
            brew install pb
            ```

            **Update existing installation:**
            ```bash
            pb update
            ```

            ### SHA256 Checksum
            ```
            ${{ steps.sha256.outputs.SHA256 }}
            ```

            ### What's Changed
            See commits for details.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update Homebrew Formula
        run: |
          # Clone the tap repository
          git clone https://github.com/promptbrain/homebrew-tap.git tap-repo
          cd tap-repo

          # Update the formula
          sed -i "s|url \".*\"|url \"https://github.com/promptbrain/cli/archive/refs/tags/v${{ steps.get_version.outputs.VERSION }}.tar.gz\"|" Formula/pb.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha256.outputs.SHA256 }}\"|" Formula/pb.rb

          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/pb.rb
          git commit -m "Update pb to v${{ steps.get_version.outputs.VERSION }}"
          git push

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
