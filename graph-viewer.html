<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptBrain Context Graph Viewer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }
        #header {
            background: #1a1a1a;
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
            color: #888;
        }
        .stat { display: flex; align-items: center; gap: 8px; }
        .stat-value { color: #4CAF50; font-weight: bold; }
        #graph {
            width: 100vw;
            height: calc(100vh - 100px);
        }
        .node {
            cursor: pointer;
            transition: all 0.3s;
        }
        .node:hover {
            stroke: #4CAF50;
            stroke-width: 3px;
        }
        .node-label {
            font-size: 12px;
            fill: #fff;
            pointer-events: none;
            text-anchor: middle;
        }
        .link {
            stroke: #444;
            stroke-opacity: 0.6;
            stroke-width: 1.5px;
        }
        #controls {
            position: absolute;
            top: 120px;
            right: 20px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 0;
            width: 100%;
        }
        button:hover { background: #45a049; }
        #status {
            margin-top: 10px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
            font-size: 12px;
        }
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }
        .empty-state h2 { margin-bottom: 20px; }
        .empty-state code {
            background: #1a1a1a;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🧠 PromptBrain Context Graph</h1>
        <div id="stats">
            <div class="stat">Nodes: <span class="stat-value" id="node-count">0</span></div>
            <div class="stat">Edges: <span class="stat-value" id="edge-count">0</span></div>
            <div class="stat">Clusters: <span class="stat-value" id="cluster-count">0</span></div>
        </div>
    </div>

    <div id="controls">
        <button onclick="loadGraph()">🔄 Refresh Graph</button>
        <button onclick="searchGraph()">🔍 Search</button>
        <div id="status">Ready</div>
    </div>

    <svg id="graph"></svg>

    <script>
        const API_KEY = 'pb_239d7094b81e9f0e21d6023047380c0f9bd4b08f63cee3b6947fae8bcd67dc8aec60eeaf3eab4b7a';
        const BASE_URL = 'http://localhost:3000';

        let simulation;

        async function loadGraph() {
            const status = document.getElementById('status');
            status.textContent = 'Loading...';

            try {
                const response = await fetch(`${BASE_URL}/api/graph/data`, {
                    headers: { 'x-api-key': API_KEY }
                });
                const data = await response.json();

                // Update stats
                document.getElementById('node-count').textContent = data.metadata.total_nodes;
                document.getElementById('edge-count').textContent = data.metadata.total_edges;
                document.getElementById('cluster-count').textContent = data.metadata.total_clusters;

                if (data.nodes.length === 0) {
                    showEmptyState();
                    status.textContent = 'No data yet';
                } else {
                    renderGraph(data);
                    status.textContent = `Loaded ${data.nodes.length} nodes`;
                }
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
                console.error('Error loading graph:', error);
            }
        }

        function showEmptyState() {
            const svg = d3.select('#graph');
            svg.selectAll('*').remove();

            const container = d3.select('body').append('div')
                .attr('class', 'empty-state');

            container.html(`
                <h2>No Context Data Yet</h2>
                <p>Link an integration to populate the graph:</p>
                <code>PB_API_URL=http://localhost:3000 node bin/pb link notion</code>
                <p style="margin-top: 20px; color: #888;">
                    After linking, authorize in the browser and wait for sync to complete.
                </p>
            `);
        }

        function renderGraph(data) {
            // Remove empty state if exists
            d3.select('.empty-state').remove();

            const svg = d3.select('#graph');
            svg.selectAll('*').remove();

            const width = window.innerWidth;
            const height = window.innerHeight - 100;

            const g = svg.append('g');

            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });
            svg.call(zoom);

            // Create force simulation
            simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.edges).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));

            // Draw edges
            const link = g.append('g')
                .selectAll('line')
                .data(data.edges)
                .join('line')
                .attr('class', 'link');

            // Draw nodes
            const node = g.append('g')
                .selectAll('circle')
                .data(data.nodes)
                .join('circle')
                .attr('class', 'node')
                .attr('r', d => 5 + (d.salience || 0.5) * 15)
                .attr('fill', d => getNodeColor(d.type))
                .call(drag(simulation));

            // Add labels
            const label = g.append('g')
                .selectAll('text')
                .data(data.nodes)
                .join('text')
                .attr('class', 'node-label')
                .attr('dy', -20)
                .text(d => d.label);

            // Update positions on tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });

            // Node click handler
            node.on('click', (event, d) => {
                console.log('Node clicked:', d);
                alert(`Node: ${d.label}\nType: ${d.type}\nSalience: ${d.salience}`);
            });
        }

        function getNodeColor(type) {
            const colors = {
                'notion': '#000000',
                'cursor': '#0066FF',
                'figma': '#F24E1E',
                'chatgpt': '#10A37F',
                'file': '#FFB800',
                'concept': '#9B59B6',
                'default': '#4CAF50'
            };
            return colors[type] || colors.default;
        }

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }

        function searchGraph() {
            const query = prompt('Enter search query:');
            if (!query) return;

            fetch(`${BASE_URL}/api/graph/search?q=${encodeURIComponent(query)}`, {
                headers: { 'x-api-key': API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                alert(`Found ${data.results.length} results for "${query}"`);
                console.log('Search results:', data.results);
            })
            .catch(err => {
                alert('Search failed: ' + err.message);
            });
        }

        // Load graph on page load
        loadGraph();

        // Auto-refresh every 30 seconds
        setInterval(loadGraph, 30000);
    </script>
</body>
</html>
